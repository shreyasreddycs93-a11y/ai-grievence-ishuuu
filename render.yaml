# Render Blueprint: one Docker web service + a Postgres database (pgvector is
# available on Render Postgres; the app runs CREATE EXTENSION vector on boot).
services:
  - type: web
    name: civicsahayak
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: civicsahayak-db
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: DEPARTMENT_INVITE_CODE
        sync: false

databases:
  - name: civicsahayak-db
    plan: free
    databaseName: grievanceai
    user: grievanceai
